<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店鋪 OOS 檢查工具 v7</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background-color: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; font-size: 22px; border-bottom: 2px solid #e8eaed; padding-bottom: 10px; margin-top: 0; }

        .top-actions { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .btn-history { background-color: #fff; color: #1a73e8; border: 1px solid #1a73e8; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-history:hover { background-color: #e8f0fe; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #444; }
        select, input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }

        .search-box { margin-bottom: 10px; }

        .product-list { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; padding: 10px; background: #fafafa; }
        details { margin-bottom: 10px; background: white; border: 1px solid #eee; border-radius: 4px; }
        summary { padding: 10px; font-weight: bold; cursor: pointer; background: #f8f9fa; border-radius: 4px; user-select: none; color: #1a73e8; }
        summary:hover { background: #e9ecef; }
        .checkbox-group { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .checkbox-item { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; }
        .checkbox-item input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; cursor: pointer; }
        .checkbox-item label { font-weight: normal; margin-bottom: 0; cursor: pointer; font-size: 15px; line-height: 1.4; color: #333; width: 100%; }

        .selected-count { text-align: right; font-size: 13px; color: #666; margin-top: 6px; font-weight: bold; }
        .selected-count.has-items { color: #1a73e8; }

        .custom-product-box { display: flex; gap: 8px; margin-top: 12px; }
        .custom-product-box input { flex: 1; }
        .custom-product-box button { background-color: #1a73e8; color: white; border: none; padding: 0 16px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .custom-product-box button:hover { background-color: #1557b0; }
        .custom-list-wrap { margin-top: 10px; }
        .custom-item-row { display: flex; align-items: center; gap: 10px; background: #fff8e1; border: 1px solid #ffe082; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
        .custom-item-row label { flex: 1; font-size: 14px; }
        .custom-item-row .remove-btn { background: #ea4335; color: white; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 13px; line-height: 1; flex-shrink: 0; }

        button.submit-btn { background-color: #1a73e8; color: white; border: none; padding: 14px 20px; cursor: pointer; border-radius: 6px; font-size: 16px; width: 100%; font-weight: bold; margin-top: 10px; }
        button.submit-btn:hover { background-color: #1557b0; }

        .result-container { margin-top: 30px; display: none; padding: 15px; background: #e8f0fe; border-radius: 8px; border: 1px solid #d2e3fc; }
        .result-container h3 { margin-top: 0; color: #1a73e8; font-size: 18px; }
        textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; resize: vertical; min-height: 200px; font-family: monospace; }
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .action-btns button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-copy { background-color: #34a853; color: white; }
        .btn-reset { background-color: #ea4335; color: white; }

        .history-panel { display: none; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; padding: 12px; }
        .history-panel h3 { margin: 0 0 10px 0; font-size: 16px; color: #1a73e8; display: flex; justify-content: space-between; align-items: center; }
        .btn-clear-history { background: none; border: none; color: #ea4335; font-size: 12px; cursor: pointer; text-decoration: underline; font-weight: normal; }
        .history-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: white; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; }
        .history-item .meta { font-size: 12px; color: #888; margin-bottom: 4px; }
        .history-item .store-name { font-weight: bold; font-size: 14px; color: #333; margin-bottom: 6px; }
        .history-item pre { white-space: pre-wrap; font-family: monospace; font-size: 12px; background: #f5f5f5; padding: 6px; border-radius: 4px; margin: 6px 0; max-height: 120px; overflow-y: auto; }
        .history-item .h-btns { display: flex; gap: 6px; }
        .history-item .h-btns button { flex: 1; padding: 6px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }
        .h-copy { background-color: #34a853; color: white; }
        .h-delete { background-color: #ea4335; color: white; }
        .empty-history { text-align: center; color: #999; font-size: 13px; padding: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 店鋪缺貨 (OOS) 紀錄工具</h1>

    <div class="top-actions">
        <button class="btn-history" onclick="toggleHistory()">📜 歷史紀錄 (<span id="historyBadge">0</span>)</button>
    </div>

    <div class="history-panel" id="historyPanel">
        <h3>巡查歷史紀錄 <button class="btn-clear-history" onclick="clearAllHistory()">清除全部</button></h3>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="form-group">
        <label for="storeSelect">1. 選擇店鋪名稱</label>
        <select id="storeSelect">
            <option value="" disabled selected>-- 請選擇店鋪 --</option>
            <option value=" ">手動輸入)</option>
            <option value="WCL-215590 K11">[WCL-215590] K11 - MARKET PLACE (尖沙咀梳士巴利道18號維港文化匯 K11 MUSEA B2 層B201-01A舖)</option>
            <option value="WCL-214718 帝后廣場">[WCL-214718] 帝后廣場 - 惠康 (九龍漆咸道南 17-19 號帝后廣場地舖)</option>
            <option value="WCL-213819 圓方">[WCL-213819] 圓方 - 3hreeSixty (香港九龍尖沙咀柯士甸道西1號圓方1090號舖)</option>
            <option value="WCL-215376 奧海城">[WCL-215376] 奧海城 - MARKET PLACE (九龍大角咀西九龍海庭道18號奧海城II 期地下G1及G10號舖)</option>
            <option value="PNS-429 浪澄灣">[PNS-429] 浪澄灣 - FUSION (九龍大角咀海輝道8號浪澄灣2樓2號舖)</option>
            <option value="WCL-213512 港灣豪庭">[WCL-213512] 港灣豪庭 - 惠康 (九龍大角咀福利街 8 號港灣豪庭廣場 1 樓 125 舖)</option>
            <option value="WCL-213850 朗豪坊">[WCL-213850] 朗豪坊 - MARKET PLACE (九龍朗豪坊地庫B2, 8號舖)</option>
            <option value="PNS-457 曾榕大廈">[PNS-457] 曾榕大廈 - FUSION (九龍窩打老道 70 號曾榕大廈地下)</option>
        </select>
    </div>

    <div class="form-group">
        <label>2. 選擇缺貨商品 (OOS)</label>
        <input type="text" id="searchInput" class="search-box" placeholder="輸入關鍵字快速搜尋商品..." onkeyup="filterProducts()">

        <div class="product-list" id="productList">
            </div>

        <div class="selected-count" id="selectedCount">已選 0 項缺貨商品</div>

        <div class="custom-product-box">
            <input type="text" id="customProductInput" placeholder="輸入清單外的自訂商品名稱..." onkeydown="if(event.key==='Enter'){event.preventDefault();addCustomProduct();}">
            <button onclick="addCustomProduct()">+ 新增</button>
        </div>
        <div class="custom-list-wrap" id="customListWrap"></div>
    </div>

    <button class="submit-btn" onclick="generateReport()">生成回答結果</button>

    <div class="result-container" id="resultContainer">
        <h3>📋 檢查結果 (可直接複製)</h3>
        <textarea id="resultText" readonly></textarea>
        <div class="action-btns">
            <button class="btn-copy" onclick="copyResult()">複製結果</button>
            <button class="btn-reset" onclick="resetForm()">清除並檢查下一間</button>
        </div>
    </div>
</div>

<script>
    const productData = {
        "餅乾類 (BISCUIT)": [
            "檸檬夾心餅", "芝士夾心餅", "開心果仁迷你牛油曲奇",
            "5黑全麥梳打餅6包裝",
            "香蔥薄餅", "椰圈", "麥芽酥",
            "朱古力威化", "檸檬威化", "迷你威化", "花生威化", "士多啤梨威化"
        ],
        "麵包類 - 餐包及軟包": [
            "黑糖提子餐包", "小餐包", "牛奶餐包",
            "衛星包", "牛油軟包", "提子餐包",
            "甜餐包", "扭紋餐包", "高蛋白質餐包",
            "排包", "提子包", "芝麻軟包",
            "香濃牛油丹麥吐司", "雙重朱古力丹麥吐司",
            "英式鬆餅", "法國牛角酥", "漢堡包", "熱狗包"
        ],
        "麵包類 - 忌廉檳": [
            "柚子乳酪味忌廉檳", "黑芝麻味忌廉檳", "車打芝士味忌廉檳",
            "朱古力味忌廉檳", "檸檬味忌廉檳", "花生味忌廉檳", "雲呢拿味忌廉檳"
        ],
        "麵包類 - 方包及健康麥包": [
            "十三穀三文治包(6片)", "奇亞籽三文治麥包(6片)", "純麥包(11片)",
            "番茄香草酸種三文治包(6片)", "三色藜麥南瓜籽三文治包", "胚芽全麥麵包",
            "五黑厚切湯種吐司", "牛油方包(6片)", "蜜糖雞蛋方包(6片)",
            "牛奶方包(6片)", "幼麥方包(6片)", "切皮三文治方包(6片)",
            "切皮三文治方包(12片)", "特厚切皮三文治方包(4片)", "特厚切皮三文治麥包(4片)",
            "切皮三文治方麥包(12片)", "切皮三文治方麥包(6片)", "特厚切方包(4片)",
            "生命麵包(14片)", "生命麵包全蛋白質(14片)", "生命麵包蜜糖雞蛋(14片)",
            "生命麥包(14片)", "多穀三文治方包(8片)", "紫薯牛奶厚切湯種吐司(4片)",
            "方包(8片)", "原條方包 (18片)", "厚切方包(6片)",
            "厚切方麥包(6片)", "薄切方包(10片)", "方麥包(8片)"
        ],
        "蛋糕類 - 牛油及海綿蛋糕": [
            "孖寶蛋糕藍莓", "孖寶蛋糕櫻桃提子", "孖寶蛋糕特濃朱古力",
            "孖寶蛋糕合桃", "合桃蛋糕", "朱古力味忌廉夾心小蛋糕",
            "奶油味莉萊蛋糕", "檸檬味莉萊蛋糕", "香橙味莉萊蛋糕",
            "菠蘿味莉萊蛋糕", "星級夾心海綿蛋糕牛奶味", "星級夾心海綿蛋糕朱古力咖啡味",
            "熱香餅", "朱古力味雪芳蛋糕", "檸檬味雪芳蛋糕",
            "牛奶味雪芳蛋糕", "香橙味雪芳蛋糕", "芝士味雪芳蛋糕",
            "朱古力超軟蛋糕", "雲呢拿味超軟蛋糕"
        ],
        "蛋糕類 - 瑞士卷": [
            "朱古力迷你瑞士卷", "椰子朱古力咖啡味迷你瑞士卷", "檸檬迷你瑞士卷",
            "芒果迷你瑞士卷", "香橙迷你瑞士卷", "花生迷你瑞士卷", "迷你瑞士卷 – 雙重抹茶味"
        ]
    };

    let customProducts = [];
    let customIdCounter = 0;
    const HISTORY_KEY = 'oosHistoryLog';

    function renderProducts() {
        const container = document.getElementById('productList');
        let html = '';
        let catIndex = 0;

        for (const [category, products] of Object.entries(productData)) {
            html += `<details class="product-category">
                        <summary>${category} (${products.length})</summary>
                        <div class="checkbox-group">`;

            products.forEach((product, prodIndex) => {
                const id = `chk_${catIndex}_${prodIndex}`;
                html += `<div class="checkbox-item">
                            <input type="checkbox" id="${id}" value="${product}" class="oos-checkbox">
                            <label for="${id}">${product}</label>
                         </div>`;
            });

            html += `</div></details>`;
            catIndex++;
        }
        container.innerHTML = html;
    }

    function filterProducts() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const items = document.querySelectorAll('.checkbox-item');
        const categories = document.querySelectorAll('.product-category');

        items.forEach(item => {
            const text = item.innerText.toLowerCase();
            if (text.includes(keyword)) {
                item.style.display = "flex";
            } else {
                item.style.display = "none";
            }
        });

        categories.forEach(category => {
            const visibleItems = Array.from(category.querySelectorAll('.checkbox-item')).filter(i => i.style.display !== "none");
            if (keyword === "") {
                category.style.display = "block";
                category.open = false;
            } else {
                category.style.display = visibleItems.length > 0 ? "block" : "none";
                if (visibleItems.length > 0) category.open = true;
            }
        });
    }

    function updateSelectedCount() {
        const count = document.querySelectorAll('.oos-checkbox:checked').length;
        const el = document.getElementById('selectedCount');
        el.innerText = `已選 ${count} 項缺貨商品`;
        el.classList.toggle('has-items', count > 0);
    }

    function addCustomProduct() {
        const input = document.getElementById('customProductInput');
        const name = input.value.trim();
        if (!name) {
            alert('請輸入商品名稱！');
            return;
        }
        customIdCounter++;
        const cid = `custom_${customIdCounter}`;
        customProducts.push({ id: cid, name: name });
        renderCustomProducts();
        input.value = '';
        input.focus();
        updateSelectedCount();
    }

    function removeCustomProduct(cid) {
        customProducts = customProducts.filter(p => p.id !== cid);
        renderCustomProducts();
        updateSelectedCount();
    }

    function renderCustomProducts() {
        const wrap = document.getElementById('customListWrap');
        if (customProducts.length === 0) {
            wrap.innerHTML = '';
            return;
        }
        let html = '';
        customProducts.forEach(p => {
            html += `<div class="custom-item-row">
                        <input type="checkbox" id="${p.id}" value="${p.name}" class="oos-checkbox" checked onchange="updateSelectedCount()">
                        <label for="${p.id}">${p.name} <span style="color:#b8860b;">(自訂)</span></label>
                        <button class="remove-btn" onclick="removeCustomProduct('${p.id}')" title="移除">✕</button>
                     </div>`;
        });
        wrap.innerHTML = html;
    }

    async function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (e) {}
        }
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            return true;
        } catch (e) {
            return false;
        }
    }

    function loadHistory() {
        try {
            return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        } catch (e) {
            return [];
        }
    }

    function saveHistory(arr) {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
    }

    function addToHistory(storeLabel, text) {
        const history = loadHistory();
        history.unshift({
            id: Date.now(),
            time: new Date().toLocaleString('zh-HK', { hour12: false }),
            store: storeLabel,
            text: text
        });
        saveHistory(history);
        renderHistory();
    }

    function renderHistory() {
        const history = loadHistory();
        document.getElementById('historyBadge').innerText = history.length;
        const listEl = document.getElementById('historyList');

        if (history.length === 0) {
            listEl.innerHTML = '<div class="empty-history">暫無歷史紀錄</div>';
            return;
        }

        let html = '';
        history.forEach(item => {
            const escapedText = item.text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html += `<div class="history-item">
                        <div class="meta">${item.time}</div>
                        <div class="store-name">${item.store}</div>
                        <pre>${escapedText}</pre>
                        <div class="h-btns">
                            <button class="h-copy" onclick="copyHistoryItem(${item.id})">複製</button>
                            <button class="h-delete" onclick="deleteHistoryItem(${item.id})">刪除</button>
                        </div>
                     </div>`;
        });
        listEl.innerHTML = html;
    }

    async function copyHistoryItem(id) {
        const history = loadHistory();
        const item = history.find(h => h.id === id);
        if (!item) return;
        const ok = await copyText(item.text);
        if (ok) alert('已複製此筆歷史紀錄！');
    }

    function deleteHistoryItem(id) {
        if (!confirm('確定要刪除這筆歷史紀錄嗎？')) return;
        let history = loadHistory();
        history = history.filter(h => h.id !== id);
        saveHistory(history);
        renderHistory();
    }

    function clearAllHistory() {
        if (!confirm('確定要清除全部歷史紀錄嗎？此動作無法復原。')) return;
        saveHistory([]);
        renderHistory();
    }

    function toggleHistory() {
        const panel = document.getElementById('historyPanel');
        panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    }

    function generateReport() {
        const storeSelect = document.getElementById('storeSelect');
        const storeHeader = storeSelect.value;
        const storeLabelText = storeSelect.options[storeSelect.selectedIndex] ? storeSelect.options[storeSelect.selectedIndex].text : storeHeader;

        if (!storeHeader || storeHeader.trim() === '') {
            alert('請先選擇店鋪名稱！');
            return;
        }

        const checkboxes = document.querySelectorAll('.oos-checkbox:checked');
        if (checkboxes.length === 0) {
            alert('請至少選擇一項 OOS 缺貨商品！');
            return;
        }

        let reportText = `${storeHeader}\n\nOOS\n`;

        checkboxes.forEach(cb => {
            reportText += `${cb.value}\n`;
        });

        reportText += `\n已通知經理`;

        document.getElementById('resultText').value = reportText;
        document.getElementById('resultContainer').style.display = 'block';

        addToHistory(storeLabelText, reportText);

        document.getElementById('resultContainer').scrollIntoView({ behavior: 'smooth' });
    }

    async function copyResult() {
        const text = document.getElementById('resultText').value;
        const ok = await copyText(text);

        const btn = document.querySelector('.btn-copy');
        const originalText = btn.innerText;
        if (ok) {
            btn.innerText = '✅ 已複製結果！';
            btn.style.backgroundColor = '#1e8e3e';
        } else {
            btn.innerText = '⚠️ 複製失敗，請手動選取';
            btn.style.backgroundColor = '#ea4335';
        }
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = '#34a853';
        }, 2000);
    }

    function resetForm() {
        if(confirm('確定要清除所有選項並檢查下一間嗎？')) {
            document.getElementById('storeSelect').value = '';
            document.getElementById('searchInput').value = '';
            const checkboxes = document.querySelectorAll('.oos-checkbox');
            checkboxes.forEach(cb => cb.checked = false);
            customProducts = [];
            renderCustomProducts();
            document.getElementById('customProductInput').value = '';
            document.getElementById('resultContainer').style.display = 'none';
            updateSelectedCount();
            filterProducts();
            window.scrollTo(0, 0);
        }
    }

    document.addEventListener('change', function(e) {
        if (e.target.classList && e.target.classList.contains('oos-checkbox')) {
            updateSelectedCount();
        }
    });

    window.onload = function() {
        renderProducts();
        renderHistory();
        updateSelectedCount();
    };
</script>

</body>
</html>
